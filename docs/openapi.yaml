openapi: 3.1.0
info:
  title: Bluesky → Discord Alert Bot API
  version: 1.0.0
  description: 'The control panel''s REST API. It is reachable only from the computer
    the bot runs on (127.0.0.1) and has no login. Every change (POST, PUT, PATCH,
    DELETE) needs the CSRF token from GET /api/csrf/ in the X-CSRFToken header, together
    with its csrftoken cookie, and a JSON body. Webhook URLs and the App Password
    are write-only. Background, security rules and error codes: docs/API.md.'
  license:
    name: MIT
    identifier: MIT
paths:
  /api/accounts/:
    get:
      operationId: accounts_list
      summary: Watched accounts, newest first
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
    post:
      operationId: accounts_create
      description: '`handle` accepts @handle, a bsky.app link or a DID. Sending the
        removed `discord_webhook_url` field is refused; use `channel_id`.'
      summary: Watch an account
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - csrfToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                - $ref: '#/components/schemas/Error'
          description: 'Form errors per field, e.g. {"handle": ["You''re already watching
            @a.bsky.social."]}. No `code`: this shape is kept from the first API version.
            Or the standard error with code `invalid_json` when the body isn''t valid
            JSON.'
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/{id}/:
    get:
      operationId: accounts_retrieve
      summary: One account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id or address (code `not_found`).
    put:
      operationId: accounts_update
      summary: Replace an account's settings
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                - $ref: '#/components/schemas/Error'
          description: 'Form errors per field, e.g. {"handle": ["You''re already watching
            @a.bsky.social."]}. No `code`: this shape is kept from the first API version.
            Or the standard error with code `invalid_json` when the body isn''t valid
            JSON.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id or address (code `not_found`).
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: accounts_partial_update
      summary: Change an account (pause, channel, name, …)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
      security:
      - csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                - $ref: '#/components/schemas/Error'
          description: 'Form errors per field, e.g. {"handle": ["You''re already watching
            @a.bsky.social."]}. No `code`: this shape is kept from the first API version.
            Or the standard error with code `invalid_json` when the body isn''t valid
            JSON.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id or address (code `not_found`).
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: accounts_destroy
      summary: Stop watching an account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - accounts
      security:
      - csrfToken: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id or address (code `not_found`).
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/{id}/poll_now/:
    post:
      operationId: accounts_poll_now_create
      description: Runs inside the request (a few seconds).
      summary: Check one account now
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - accounts
      security:
      - csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResult'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id or address (code `not_found`).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`already_checking`.'
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/{id}/posts/:
    get:
      operationId: accounts_posts_list
      description: |-
        GET /api/accounts/{id}/posts/ — the posts noticed for this account, newest first,
        20 per page (?page=2). Replaces the nested `seen_posts` list that older versions returned.
      summary: Posts noticed for an account, newest first
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id or address (code `not_found`).
  /api/accounts/check_all/:
    post:
      operationId: accounts_check_all_create
      description: 'Returns the job (also when one was already running: created=false).
        Location header: the job''s address.'
      summary: Check every account in the background
      tags:
      - accounts
      security:
      - csrfToken: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckJobStarted'
          description: ''
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/activity/:
    get:
      operationId: activity_list
      description: 'Cursor-paged: follow `next`.'
      summary: The activity log, newest first
      parameters:
      - in: query
        name: account
        schema:
          type: integer
      - in: query
        name: before
        schema:
          type: string
        description: A date or a time.
      - in: query
        name: channel
        schema:
          type: integer
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: group
        schema:
          type: string
          enum:
          - all
          - failed_checks
          - failed_sends
          - problems
          - retries
          - sent
      - in: query
        name: level
        schema:
          type: string
        description: success, info, warning, error; comma-separated.
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
        description: A date (2026-10-21) or a time (2026-10-21T14:30:00Z).
      - in: query
        name: type
        schema:
          type: string
        description: Event types, comma-separated, e.g. post_sent,send_failed.
      tags:
      - status
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityEventList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`invalid_filter`, with `fields`.'
  /api/activity/{id}/:
    get:
      operationId: activity_retrieve
      description: |-
        GET /api/activity/ (newest first) and GET /api/activity/{id}/ (adds `technical`).

        Filters (all optional, combined with AND):
          group=all|sent|failed_checks|failed_sends|retries|problems
          type=post_sent,send_failed,...   level=success,info,warning,error
          account=<id>   channel=<id>   since=<date or time>   before=<date or time>
        Paging: page_size (50, at most 200); follow `next` / `previous` links.
      summary: One activity entry, with `technical`
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activity event.
        required: true
      tags:
      - status
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityEventDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unknown id or address (code `not_found`).
  /api/bluesky/profile/:
    get:
      operationId: bluesky_profile
      description: Uses Bluesky's public API (no login). The same body for every outcome;
        a missing profile is a 200 with result=not_found. For search-as-you-type,
        ignore answers whose `query` isn't the current text.
      summary: Look up a Bluesky profile
      parameters:
      - in: query
        name: handle
        schema:
          type: string
        description: A handle, @handle, bsky.app profile link or DID.
        required: true
      tags:
      - bluesky
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileLookup'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileLookup'
          description: Not a valid handle (result=invalid).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileLookup'
          description: Bluesky is limiting requests.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileLookup'
          description: Bluesky answered with an error.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileLookup'
          description: Bluesky couldn't be reached.
  /api/check-jobs/:
    get:
      operationId: check_jobs_list
      description: Newest first. An empty list before the first Check All.
      summary: Recent Check All jobs
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 1–50, default 10.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckJobList'
          description: ''
  /api/check-jobs/{job_id}/:
    get:
      operationId: check_jobs_retrieve
      description: Poll every `poll_after_seconds` until `final`.
      summary: One Check All job
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckJob'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`check_job_not_found`.'
  /api/check-jobs/latest/:
    get:
      operationId: check_jobs_latest
      description: GET /api/check-jobs/latest/ — the newest job, so the panel can
        show it again after a refresh.
      summary: The newest Check All job
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckJob'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`no_check_jobs`: Check All hasn''t been used yet.'
  /api/csrf/:
    get:
      operationId: csrf_token
      description: Sets the csrftoken cookie and returns the same token. Send it in
        X-CSRFToken on every change.
      summary: Get the CSRF token
      tags:
      - security
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/health/:
    get:
      operationId: health
      description: 200 when the database answers and is fully migrated; otherwise
        503 with the same body. Used by Docker and the Windows scripts.
      summary: Is the panel ready?
      tags:
      - status
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Starting or updating.
  /api/settings/:
    get:
      operationId: settings_retrieve
      summary: The settings
      tags:
      - settings
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
    post:
      operationId: settings_save
      summary: Change settings (same as PATCH)
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsChangeRequest'
      security:
      - csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSaved'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`invalid_settings`, with `fields`. Nothing was saved.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`settings_not_saved`: the database couldn''t be written.'
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: settings_update
      description: Applies at once, no restart. Discord channels are under /api/webhooks/;
        sending the removed `discord_webhook_url` field is refused (400).
      summary: Change settings
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSettingsChangeRequest'
      security:
      - csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSaved'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`invalid_settings`, with `fields`. Nothing was saved.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`settings_not_saved`: the database couldn''t be written.'
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/settings/test-login/:
    post:
      operationId: settings_test_login
      description: Signs in once with a throwaway session; never saves anything. At
        most 5 tests per 5 minutes. A rejected login is a 200 with result=rejected.
      summary: Test a Bluesky login
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginTestCredentialsRequest'
      security:
      - csrfToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTest'
          description: ''
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LoginTest'
                - $ref: '#/components/schemas/Error'
          description: Nothing to test (result=invalid). Or the standard error with
            code `invalid_json` when the body isn't valid JSON.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTest'
          description: Too many tests, or Bluesky is limiting sign-ins. Retry-After
            header.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTest'
          description: Bluesky answered with an error.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTest'
          description: Bluesky couldn't be reached.
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/status/:
    get:
      operationId: status
      description: Overall state, checker health, Bluesky login, setup progress, counts
        and current problems.
      summary: The bot's status
      tags:
      - status
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
  /api/webhooks/:
    get:
      operationId: webhooks_list
      description: |-
        Named Discord channels (webhooks).

        DELETE refuses (409) while accounts use the channel or it is the default, unless
        `?reassign_to=<channel id>` or `?reassign_to=default` says where they should go.
      summary: Discord channels
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - channels
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChannelList'
          description: ''
    post:
      operationId: webhooks_create
      description: |-
        Named Discord channels (webhooks).

        DELETE refuses (409) while accounts use the channel or it is the default, unless
        `?reassign_to=<channel id>` or `?reassign_to=default` says where they should go.
      summary: Add a channel
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelRequest'
        required: true
      security:
      - csrfToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                - $ref: '#/components/schemas/Error'
          description: 'Form errors per field, e.g. {"handle": ["You''re already watching
            @a.bsky.social."]}. No `code`: this shape is kept from the first API version.
            Or the standard error with code `invalid_json` when the body isn''t valid
            JSON.'
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body isn't JSON (code `json_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/webhooks/{id}/:
    get:
      operationId: webhooks_retrieve
      description: |-
        Named Discord channels (webhooks).

        DELETE refuses (409) while accounts use the channel or it is the default, unless
        `?reassign_to=<channel id>` or `?reassign_to=default` says where they should go.
      summary: One channel
      parameters:
      - in: path
        name: id
        schema:
          type: integer
