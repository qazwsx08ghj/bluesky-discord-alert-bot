    delete:
      operationId: webhooks_destroy
      description: |-
        Named Discord channels (webhooks).

        DELETE refuses (409) while accounts use the channel or it is the default, unless
        `?reassign_to=<channel id>` or `?reassign_to=default` says where they should go.
      summary: Delete a channel
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this discord webhook.
        required: true
      - in: query
        name: reassign_to
        schema:
          type: string
        description: 'Where its accounts go: a channel id, or `default`.'
      tags:
      - channels
      security:
      - csrfToken: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`invalid_reassign`.'
        '404':
          content:
            application/json:
              schema:
