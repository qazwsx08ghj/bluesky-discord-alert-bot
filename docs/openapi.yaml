components:
  schemas:
    Account:
      type: object
      description: A watched account, with its current status (bluesky_monitor/account_status.py).
      properties:
        id:
          type: integer
          readOnly: true
        handle:
          type: string
          description: e.g. user.bsky.social
          maxLength: 255
        display_name:
          type: string
          maxLength: 255
        channel_id:
          type:
          - integer
          - 'null'
        channel:
          oneOf:
          - $ref: '#/components/schemas/AccountChannel'
          - type: 'null'
          readOnly: true
        uses_default_channel:
          type: boolean
          readOnly: true
        is_active:
          type: boolean
        announce_posts:
          type: boolean
        announce_reposts:
          type: boolean
        announce_replies:
          type: boolean
        first_poll_done:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/AccountState'
          readOnly: true
        state_label:
          type: string
          readOnly: true
        state_message:
          type: string
          readOnly: true
        checking_now:
          type: boolean
          readOnly: true
        problem:
          oneOf:
          - $ref: '#/components/schemas/AccountProblem'
          - type: 'null'
          readOnly: true
        first_check:
          allOf:
          - $ref: '#/components/schemas/FirstCheck'
          readOnly: true
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        last_check_ok:
          type:
          - boolean
          - 'null'
          readOnly: true
        last_success_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        last_error:
          oneOf:
          - $ref: '#/components/schemas/LastError'
          - type: 'null'
          readOnly: true
      required:
      - announce_posts
      - announce_replies
      - announce_reposts
      - channel
      - channel_id
      - checking_now
      - created_at
      - display_name
      - first_check
      - first_poll_done
      - handle
      - id
      - is_active
      - last_check_ok
      - last_checked_at
      - last_error
      - last_success_at
      - problem
      - state
      - state_label
      - state_message
      - uses_default_channel
    AccountChannel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_default:
          type: boolean
      required:
      - id
      - is_default
      - name
    AccountCheckResult:
      enum:
      - checked
      - failed
      - skipped
      - already_checking
      type: string
    AccountProblem:
      type: object
      description: A failure explained in plain language. `fix` says where the panel
        can fix it.
      properties:
        category:
          type: string
          description: Problem code, e.g. bluesky_login_rejected (docs/ACTIVITY_AND_STATUS.md).
        title:
          type: string
        explanation:
          type: string
        fix:
          $ref: '#/components/schemas/Fix'
        severity:
          allOf:
          - $ref: '#/components/schemas/AccountProblemSeverity'
          description: 'warning: usually clears by itself.'
      required:
      - category
      - explanation
      - fix
      - severity
      - title
    AccountProblemSeverity:
      enum:
      - error
      - warning
      type: string
    AccountRef:
      type: object
      properties:
        id:
          type: integer
        handle:
          type: string
      required:
      - handle
      - id
    AccountRequest:
      type: object
      description: A watched account, with its current status (bluesky_monitor/account_status.py).
      properties:
        handle:
          type: string
          minLength: 1
          description: e.g. user.bsky.social
          maxLength: 255
        display_name:
          type: string
          maxLength: 255
        channel_id:
          type:
          - integer
          - 'null'
        is_active:
          type: boolean
        announce_posts:
          type: boolean
        announce_reposts:
          type: boolean
        announce_replies:
          type: boolean
      required:
      - handle
    AccountState:
      enum:
      - checking
      - paused
      - error
      - waiting_first_check
      - active
      type: string
    ActivityEvent:
      type: object
      description: |-
        One log line. `problem` explains a failure in plain language ({category, title,
        explanation, fix}); the technical cause is only in the single-event view.
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        repeat_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        type:
          type: string
          maxLength: 32
        level:
          $ref: '#/components/schemas/ActivityLevel'
        message:
          type: string
          maxLength: 500
        problem:
          oneOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
          readOnly: true
        account:
          oneOf:
          - $ref: '#/components/schemas/ActivityRef'
          - type: 'null'
          readOnly: true
        channel:
          oneOf:
          - $ref: '#/components/schemas/ActivityRef'
          - type: 'null'
          readOnly: true
        attempt:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_retry:
          type: boolean
          readOnly: true
        detail:
          type: object
          additionalProperties: {}
          readOnly: true
          description: Extra facts, e.g. post_url, post_text, seeded_posts.
      required:
      - account
      - attempt
      - channel
      - created_at
      - detail
      - id
      - is_retry
      - last_seen_at
      - level
      - message
      - problem
      - repeat_count
      - type
    ActivityEventDetail:
      type: object
      description: |-
        One log line. `problem` explains a failure in plain language ({category, title,
        explanation, fix}); the technical cause is only in the single-event view.
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        repeat_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        type:
          type: string
          maxLength: 32
        level:
          $ref: '#/components/schemas/ActivityLevel'
        message:
          type: string
          maxLength: 500
        problem:
          oneOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
          readOnly: true
        account:
          oneOf:
          - $ref: '#/components/schemas/ActivityRef'
          - type: 'null'
          readOnly: true
        channel:
          oneOf:
          - $ref: '#/components/schemas/ActivityRef'
          - type: 'null'
          readOnly: true
        attempt:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_retry:
          type: boolean
          readOnly: true
        detail:
          type: object
          additionalProperties: {}
          readOnly: true
          description: Extra facts, e.g. post_url, post_text, seeded_posts.
        technical:
          type: string
          maxLength: 1000
      required:
      - account
      - attempt
      - channel
      - created_at
      - detail
      - id
      - is_retry
      - last_seen_at
      - level
      - message
      - problem
      - repeat_count
      - technical
      - type
    ActivityLevel:
      enum:
      - success
      - info
      - warning
      - error
      type: string
    ActivityRef:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
        label:
          type: string
      required:
      - id
      - label
    BlankEnum:
      enum:
      - ''
    BlueskyLogin:
      type: object
      properties:
        state:
          allOf:
          - $ref: '#/components/schemas/LoginState'
          description: 'unknown: saved, not tried yet.'
        handle:
          type: string
        problem:
          oneOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
        retry_after:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - handle
      - problem
      - retry_after
      - state
    BotState:
      enum:
      - running
      - problem
      - not_configured
      - unavailable
      type: string
    Channel:
      type: object
      description: |-
        A named channel. `url` is write-only; responses show `url_masked`.

        On edit, leave `url` out (or send the masked value back) to keep the saved URL.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: 'Friendly label, e.g. #announcements'
          maxLength: 255
        url_masked:
          type: string
          readOnly: true
          description: e.g. https://discord.com/api/webhooks/1234/****abcd
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        account_count:
          type: integer
          readOnly: true
        last_delivery:
          oneOf:
          - $ref: '#/components/schemas/LastDelivery'
          - type: 'null'
          readOnly: true
      required:
      - account_count
      - created_at
      - id
      - is_default
      - last_delivery
      - name
      - updated_at
      - url_masked
    ChannelRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    ChannelRequest:
      type: object
