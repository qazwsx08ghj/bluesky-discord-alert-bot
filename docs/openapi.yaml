          description: Unknown id or address (code `not_found`).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`channel_in_use` (with `accounts`), `channel_is_default` or
            `no_default_channel`.'
        '403':
          description: 'Refused: missing or wrong CSRF token (code `csrf_failed`),
            or sent from another website (code `cross_site_request`).'
          content:
            application/json:
              schema:
