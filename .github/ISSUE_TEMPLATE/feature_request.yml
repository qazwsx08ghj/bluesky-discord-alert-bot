name: Feature request / 功能建議
description: Suggest an improvement. / 建議新功能或改進。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 你想做什麼？
      description: The situation or problem, rather than a specific solution. / 請描述情境或問題，而不是特定的解法。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea (optional) / 你的想法（選填）
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead (optional) / 目前的替代做法（選填）
