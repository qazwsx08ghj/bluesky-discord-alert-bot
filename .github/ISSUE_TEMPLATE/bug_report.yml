name: Bug report / 問題回報
description: Something doesn't work as described. / 某個功能沒有照說明運作。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste secrets here.** No App Passwords, Discord webhook URLs, `.env` files, databases or backups: anyone can read issues. If you posted one by mistake, delete it at its source (a new App Password in Bluesky, a new webhook in Discord).
        **請勿貼上任何機密資訊。** 不要貼應用程式密碼、Discord Webhook 網址、`.env`、資料庫或備份：任何人都看得到 issue。如果不小心貼了，請到來源處作廢它。

        Security problems: don't use this form, see SECURITY.md. / 安全性問題請勿使用此表單，請見 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: Bot version / 機器人版本
      description: Control panel → Settings → About this bot.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows and Docker Desktop versions / Windows 與 Docker Desktop 版本
      placeholder: "Windows 11 24H2, Docker Desktop 4.x"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect? / 發生了什麼事？你原本預期會怎樣？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Problem report (optional) / 問題報告（選填）
      description: |
        The scripts save `logs\problem-report.txt` in the bot's folder, with passwords and webhook links hidden. Read it before pasting, and remove anything private.
        指令檔會在機器人資料夾中儲存 `logs\problem-report.txt`（密碼和 Webhook 連結已隱藏）。貼上前請先檢查，並移除任何私人資訊。
      render: text
  - type: checkboxes
    id: secrets
    attributes:
      label: Before submitting / 送出前
      options:
        - label: I checked that this issue contains no passwords, webhook URLs or other secrets. / 我已確認內容沒有密碼、Webhook 網址或其他機密資訊。
          required: true
