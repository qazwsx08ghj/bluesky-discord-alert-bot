# Publish a release: the Docker image (built for Intel/AMD and ARM; ARM is tested under emulation
# only, not yet on real ARM hardware) and the small download
# for non-technical users. Runs when a version tag is pushed:
#   v1.2.0        a release: the image gets :1.2.0 and :stable (what users' update.bat downloads)
#   v1.2.0-rc.1   a pre-release, for testing: only :1.2.0-rc.1, never :stable; its download uses
#                 that exact image, and the GitHub release is marked as a pre-release
# The tag, frontend/package.json and CHANGELOG.md must agree first (docker/release_check.py).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # attach the download to the GitHub release
  packages: write   # publish the image to ghcr.io

jobs:
  version:
    name: Tag, package.json and CHANGELOG.md agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the version CI tests with and the image runs
      - id: check
        run: python docker/release_check.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  checks:
    # Every CI job (ci.yml) must pass before anything is published.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$PRERELEASE" = "false" ]; then
            echo "tags=$image:$VERSION,$image:stable" >> "$GITHUB_OUTPUT"
            echo "download_image=$image:stable" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:$VERSION" >> "$GITHUB_OUTPUT"
            echo "download_image=$image:$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ALERTBOT_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.names.outputs.tags }}
          # Shown on the package page. The repository link is also made automatically, because
          # this workflow publishes with GITHUB_TOKEN. A multi-platform image's description is
          # read from the index annotation.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Sends a Discord notification when Bluesky accounts you choose post something new. Runs on your own computer with Docker Desktop.
            org.opencontainers.image.licenses=MIT
          annotations: |
            index:org.opencontainers.image.description=Sends a Discord notification when Bluesky accounts you choose post something new. Runs on your own computer with Docker Desktop.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
      - name: Download for users, and the release notes from CHANGELOG.md
        run: |
          python docker/make_release_bundle.py --image "${{ steps.names.outputs.download_image }}" --out dist
          python docker/release_check.py "$GITHUB_REF_NAME" --notes release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: release-notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
