<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control panel prototype · Bluesky → Discord Alert Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9;--surface:#FFFFFF;--surface-2:#F1F3F6;--hover:#EEF1F5;--border:#E3E6EB;--border-strong:#CDD2D9;
  --text:#111827;--text-2:#4B5563;--text-3:#646B76;
  --brand:#0085FF;--accent:#0070E0;--accent-hover:#005FC0;--accent-soft:#E6F1FD;--link:#0062C4;
  --ok:#126B41;--ok-bg:#E5F5EC;--warn:#8A3B0C;--warn-bg:#FEF1D6;--bad:#B42318;--bad-bg:#FDE7E5;--idle:#4B5563;--idle-bg:#EDEFF2;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 4px 12px rgba(17,24,39,.06);
  --shadow-lg:0 8px 24px rgba(17,24,39,.12),0 2px 6px rgba(17,24,39,.06);
  --scrim:rgba(17,24,39,.32);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1116;--surface:#151A21;--surface-2:#1B212A;--hover:#202733;--border:#262D38;--border-strong:#343D4B;
  --text:#E6E9EE;--text-2:#B0B8C4;--text-3:#8F98A5;
  --accent:#1570DA;--accent-hover:#2A80E6;--accent-soft:#132A45;--link:#69B1FF;
  --ok:#5BD08F;--ok-bg:#10281C;--warn:#F5C04E;--warn-bg:#2B2210;--bad:#FF8A80;--bad-bg:#2E1517;--idle:#B0B8C4;--idle-bg:#222934;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.55);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1116;--surface:#151A21;--surface-2:#1B212A;--hover:#202733;--border:#262D38;--border-strong:#343D4B;
  --text:#E6E9EE;--text-2:#B0B8C4;--text-3:#8F98A5;
  --accent:#1570DA;--accent-hover:#2A80E6;--accent-soft:#132A45;--link:#69B1FF;
  --ok:#5BD08F;--ok-bg:#10281C;--warn:#F5C04E;--warn-bg:#2B2210;--bad:#FF8A80;--bad-bg:#2E1517;--idle:#B0B8C4;--idle-bg:#222934;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.55);
  color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;caret-color:var(--accent)}
::selection{background:var(--accent-soft);color:var(--text)}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
h1,h2,h3,p{margin:0}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:1px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.icon.lg{width:20px;height:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff}
.mark .icon{width:15px;height:15px}
.brand b{font-size:14px;font-weight:600;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--text-3);font-weight:400}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:var(--hover);color:var(--text)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--link)}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;color:var(--text-3)}
.nav .count.bad{color:var(--bad)}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.side-foot .st{display:flex;align-items:center;gap:8px;font-weight:600}
.side-foot small{color:var(--text-3);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.dot.warn{background:#E8A317;box-shadow:0 0 0 3px var(--warn-bg)}
.dot.bad{background:#E5484D;box-shadow:0 0 0 3px var(--bad-bg)}
.dot.idle{background:#8F98A5;box-shadow:0 0 0 3px var(--idle-bg)}
.setup-link{display:block;margin:8px 0 0;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);text-decoration:none;color:var(--text)}
.setup-link b{display:block;font-size:13px}
.bar{height:4px;border-radius:2px;background:var(--border);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

main{min-width:0;padding:28px 32px 112px}
.wrap{max-width:1240px;margin:0 auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head h1{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.head p{color:var(--text-2);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{background:#C9302C;border-color:#C9302C;color:#fff}
.btn.danger:hover{background:#A82824}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.icon-only{width:30px;padding:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin-bottom:20px;border:1px solid}
.banner .icon{margin-top:2px}
.banner>div>b:first-child{display:block}
.banner p{color:inherit;opacity:.9}
.banner .btn{margin-left:auto;flex:none}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.banner.info{background:var(--accent-soft);color:var(--link);border-color:color-mix(in srgb,var(--link) 20%,transparent)}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;box-shadow:var(--shadow)}
.summary>div{padding:16px 18px;border-left:1px solid var(--border);min-width:0}
.summary>div:first-child{border-left:0}
.summary .l{font-size:13px;color:var(--text-2);font-weight:500}
.summary .v{font-size:20px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.summary .s{font-size:13px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .v.ok{color:var(--ok)}.summary .v.bad{color:var(--bad)}.summary .v.warn{color:var(--warn)}

/* Panels */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1680px){.grid{grid-template-columns:minmax(0,1fr) 360px}.wrap{max-width:1600px}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-h h2{font-size:15px;font-weight:600}
.panel-h p{font-size:13px;color:var(--text-3)}
.scroll{overflow-x:auto}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--text-3);padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--hover) 60%,transparent)}
tr.paused .who,tr.paused .lastpost{opacity:.6}
tr.fresh{animation:fresh 2.4s cubic-bezier(.16,1,.3,1)}
@keyframes fresh{from{background:var(--accent-soft)}to{background:transparent}}
.who{display:flex;align-items:center;gap:12px;min-width:220px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none}
.who b,.who a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.who b{font-weight:600}
.who a{font-size:13px;color:var(--text-3);text-decoration:none}
.who a:hover{color:var(--link);text-decoration:underline}
.chan{display:inline-flex;align-items:center;gap:4px;color:var(--text-2);white-space:nowrap}
.chan .icon{width:14px;height:14px;color:var(--text-3)}
.lastpost{max-width:280px;color:var(--text-2)}
.lastpost span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lastpost small{color:var(--text-3);font-size:12px}
.muted{color:var(--text-3)}
.row-acts{display:flex;gap:4px;justify-content:flex-end;position:relative}

.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.idle{background:var(--idle-bg);color:var(--idle)}
.badge.busy{background:var(--accent-soft);color:var(--link)}
.badge.busy::before{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.hint{display:block;font-size:12px;color:var(--text-3);margin-top:3px;max-width:190px;line-height:1.35}

.menu{position:absolute;right:0;top:34px;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px;min-width:170px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--hover)}
.menu .del{color:var(--bad)}

/* Activity feed */
.feed{list-style:none;margin:0;padding:4px 0}
.feed li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 16px}
.feed .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.feed .ic .icon{width:14px;height:14px}
.ic.ok{background:var(--ok-bg);color:var(--ok)}.ic.bad{background:var(--bad-bg);color:var(--bad)}.ic.idle{background:var(--idle-bg);color:var(--idle)}.ic.info{background:var(--accent-soft);color:var(--link)}
.feed .t{font-size:13px;color:var(--text-3)}
.feed .m{color:var(--text)}
.feed .q{color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed .fix{font-weight:600;font-size:13px;margin-top:4px;display:inline-block}
.panel-f{padding:10px 16px;border-top:1px solid var(--border)}

/* Activity page table */
.seg{display:inline-flex;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-weight:500;color:var(--text-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* Empty */
.empty{padding:56px 24px;text-align:center;max-width:440px;margin:0 auto}
.empty .em-ic{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--link);display:grid;place-items:center;margin:0 auto 16px}
.empty h3{font-size:16px;font-weight:600}
.empty p{color:var(--text-2);margin:6px 0 18px}

/* Settings */
.sect{display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;padding:28px 0;border-top:1px solid var(--border)}
.sect:first-of-type{border-top:0;padding-top:4px}
.sect h2{font-size:15px;font-weight:600}
.sect .d{color:var(--text-2);margin-top:4px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:500}
.field .help{font-size:13px;color:var(--text-3)}
.input,.select{height:38px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:0 12px;width:100%;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--text-3)}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.err{border-color:var(--bad)}
.input[readonly]{background:var(--surface-2);color:var(--text-2)}
.err-msg{color:var(--bad);font-size:13px;display:flex;gap:6px;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.saved{color:var(--ok);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.conn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--surface-2);margin-bottom:16px;font-size:13px}
.chan-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.chan-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--border)}
.chan-row:first-child{border-top:0}
.chan-row .n{font-weight:600;display:flex;gap:8px;align-items:center}
.chan-row .u{font-size:12px;color:var(--text-3);font-family:ui-monospace,Consolas,monospace}
.chan-row .acts{margin-left:auto;display:flex;gap:4px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--link)}
details.howto{font-size:13px;margin-top:2px}
details.howto summary{cursor:pointer;color:var(--link);font-weight:500;width:max-content}
details.howto ol{margin:8px 0 0;padding-left:20px;color:var(--text-2)}
details.howto li{margin:2px 0}

/* Setup checklist */
.steps{list-style:none;margin:0;padding:0;max-width:760px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.step-h{display:flex;align-items:center;gap:14px;padding:16px 20px}
.step-n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--text-2);flex:none}
.step.done .step-n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.current{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.step.current .step-n{border-color:var(--accent);color:var(--link)}
.step-h h3{font-size:15px;font-weight:600}
.step-h p{font-size:13px;color:var(--text-3)}
.step-h .r{margin-left:auto}
.step-b{padding:0 20px 20px 62px}
.step-b .why{color:var(--text-2);margin-bottom:16px;max-width:62ch}

/* Drawer + dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .2s ease-out}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:41;display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.16,1,.3,1)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.drawer-h h2{font-size:17px;font-weight:600}
.drawer-b{padding:20px;overflow:auto;flex:1}
.drawer-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.profile{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);margin-top:2px}
.profile .av{width:44px;height:44px;font-size:15px}
.profile b{display:block}
.profile span{font-size:13px;color:var(--text-3)}
.profile .ok-ic{margin-left:auto;color:var(--ok)}
.opts{border:0;padding:0;margin:0 0 16px}
.opts legend{font-weight:500;margin-bottom:8px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent)}
.opt b{display:block;font-weight:500}
.opt small{color:var(--text-3);font-size:13px}
.note{display:flex;gap:10px;padding:12px;border-radius:10px;background:var(--accent-soft);color:var(--link);font-size:13px;margin-top:4px}
.note .icon{margin-top:1px}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);z-index:41;padding:22px;animation:pop .2s cubic-bezier(.16,1,.3,1)}
.dialog h2{font-size:17px;font-weight:600}
.dialog p{color:var(--text-2);margin:8px 0 20px}
.dialog .f{display:flex;justify-content:flex-end;gap:8px}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}

.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:10px;background:#111827;color:#F3F4F6;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg);animation:pop2 .25s cubic-bezier(.16,1,.3,1);max-width:min(560px,calc(100vw - 32px))}
:root[data-theme="dark"] .toast{background:#E6E9EE;color:#111827}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#E6E9EE;color:#111827}}
.toast .icon{color:#5BD08F}
.toast.bad .icon{color:#FF8A80}
@keyframes pop2{from{opacity:0;transform:translateY(8px)}}

.offline main .wrap>*:not(.banner){opacity:.45;pointer-events:none;filter:saturate(.6)}

/* Prototype switcher (not part of the product) */
.proto{position:fixed;right:16px;bottom:16px;z-index:35;background:var(--surface);border:1px dashed var(--border-strong);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-lg);font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.proto b{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.proto select{height:28px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);padding:0 6px}

@media (max-width:1100px){.summary{grid-template-columns:repeat(2,1fr)}.summary>div:nth-child(3){border-left:0}.summary>div:nth-child(n+3){border-top:1px solid var(--border)}.sect{grid-template-columns:1fr;gap:12px}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:8px 12px;z-index:30;border-right:0;border-bottom:1px solid var(--border)}
  .brand{padding:4px 8px 4px 0}.brand span{display:none}
  .nav{width:auto}.nav .count{display:none}
  .side-foot,.setup-link{display:none}
  main{padding:20px 16px 96px}
  .row2{grid-template-columns:1fr}
  .step-b{padding:0 16px 16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
  <symbol id="i-checklist" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-alert-c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
  <symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16"/><path d="M4 15h16"/><path d="M10 3 8 21"/><path d="M16 3l-2 18"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></symbol>
</svg>

<div class="app" id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="overlay"></div>

<div class="proto" aria-label="Prototype controls">
  <b>Prototype</b>
  <label>State <select id="scenario">
    <option value="normal">Everything working</option>
    <option value="firstrun">First visit (setup)</option>
    <option value="problem">Bluesky login rejected</option>
    <option value="empty">No accounts yet</option>
    <option value="offline">Bot not running</option>
  </select></label>
  <label>Theme <select id="theme"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
</div>

<script>
/* Sample data for the prototype only. */
const CHANNELS=[
  {id:1,name:"announcements",url:"https://discord.com/api/webhooks/1189…/••••",isDefault:true},
  {id:2,name:"art-drops",url:"https://discord.com/api/webhooks/1204…/••••",isDefault:false}
];
const SAMPLE_ACCOUNTS=[
  {id:1,name:"Mira Draws",handle:"mira-draws.bsky.social",color:"#D9467A",channel:2,status:"active",last:"just now",post:"Commissions open for March! Five slots, details in the thread.",postAt:"just now"},
  {id:2,name:"Pixel Forge Games",handle:"pixelforge.games",color:"#1F8A70",channel:1,status:"active",last:"2 min ago",post:"Patch 1.4 is live. New boss, new hats, fewer crashes on older GPUs.",postAt:"38 min ago"},
  {id:3,name:"Night Bus News",handle:"nightbus-news.bsky.social",color:"#B7791F",channel:1,status:"active",last:"2 min ago",post:"Route 12 night service returns Friday after the bridge works finish.",postAt:"1 h ago"},
  {id:4,name:"Low Tide",handle:"lowtide.band",color:"#3A7CA5",channel:1,status:"first",last:"—",post:null},
  {id:5,name:"Tamsin Okoro",handle:"tamsin.bsky.social",color:"#6B5BD6",channel:2,status:"paused",last:"3 days ago",post:"Sketchbook tour is up on my site, thank you all for 10k!",postAt:"3 days ago"}
];
const SAMPLE_EVENTS=[
  {type:"sent",time:"just now",clock:"14:02",acct:"Mira Draws",channel:"art-drops",text:"Commissions open for March! Five slots, details in the thread."},
  {type:"failed",time:"14 min ago",clock:"13:48",acct:"Pixel Forge Games",channel:"announcements",text:"Discord didn't accept the message. The webhook for #announcements may have been deleted.",fix:"Update the webhook"},
  {type:"sent",time:"38 min ago",clock:"13:24",acct:"Pixel Forge Games",channel:"announcements",text:"Patch 1.4 is live. New boss, new hats, fewer crashes on older GPUs."},
  {type:"synced",time:"52 min ago",clock:"13:10",acct:"Low Tide",channel:"announcements",text:"Added. The first check will skip existing posts so your channel isn't flooded."},
  {type:"sent",time:"1 h ago",clock:"13:02",acct:"Night Bus News",channel:"announcements",text:"Route 12 night service returns Friday after the bridge works finish."},
  {type:"checkfail",time:"2 h ago",clock:"12:05",acct:"Low Tide",channel:"announcements",text:"Couldn't reach Bluesky. The bot will try again on the next check."}
];

const S={scenario:"normal",view:"accounts",accounts:[],events:[],filter:"all",menu:null,setupStep:2,saved:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic=(n,c="")=>`<svg class="icon ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const initials=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const chan=id=>CHANNELS.find(c=>c.id===id)||CHANNELS[0];

function loadScenario(name){
  S.scenario=name;S.menu=null;
  S.accounts=name==="empty"||name==="firstrun"?[]:SAMPLE_ACCOUNTS.map(a=>({...a}));
  S.events=name==="empty"||name==="firstrun"?[]:SAMPLE_EVENTS.map(e=>({...e}));
  if(name==="problem"){S.events.unshift({type:"loginfail",time:"6 min ago",clock:"13:56",acct:"All accounts",channel:"",text:"Bluesky didn't accept the App Password. Checks are on hold until it's fixed.",fix:"Update Bluesky login"});}
  S.view=name==="firstrun"?"setup":"accounts";
  S.setupStep=name==="firstrun"?2:5;
  render();
}

function status(){
  switch(S.scenario){
    case "offline":return{dot:"idle",label:"Not running",sub:"Can't reach the bot"};
    case "problem":return{dot:"warn",label:"Needs attention",sub:"Bluesky login rejected"};
    case "firstrun":return{dot:"idle",label:"Not set up yet",sub:`Setup ${S.setupStep-1} of 4 done`};
    default:return{dot:"ok",label:"Running",sub:"Next check in 3 min"};
  }
}
const problems=()=>S.events.filter(e=>["failed","loginfail","checkfail"].includes(e.type)).length;

function render(){
  document.body.classList.toggle("offline",S.scenario==="offline");
  const st=status();
  const nav=(v,label,icon,count="")=>`<button class="nav" data-view="${v}" ${S.view===v?'aria-current="page"':""}>${ic(icon)}${label}${count}</button>`;
  const setupDone=S.setupStep>4;
  $("#app").innerHTML=`
  <nav class="side" aria-label="Main">
    <div class="brand"><div class="mark">${ic("send")}</div><div><b>Alert Bot</b><span>Bluesky → Discord</span></div></div>
    ${setupDone?"":nav("setup","Setup","checklist",`<span class="count num">${S.setupStep-1}/4</span>`)}
    ${nav("accounts","Accounts","users",S.accounts.length?`<span class="count num">${S.accounts.length}</span>`:"")}
    ${nav("activity","Activity","activity",problems()?`<span class="count bad num">${problems()}</span>`:"")}
    ${nav("settings","Settings","settings")}
    ${setupDone?"":`<a href="#" class="setup-link" data-view="setup"><b>Finish setup</b><span class="muted" style="font-size:12px">${S.setupStep-1} of 4 steps done</span><div class="bar"><i style="width:${(S.setupStep-1)*25}%"></i></div></a>`}
    <div class="side-foot"><div class="st"><span class="dot ${st.dot}"></span>${st.label}</div><small>${st.sub}</small></div>
  </nav>
  <main id="main"><div class="wrap">${offlineBanner()}${({setup:viewSetup,accounts:viewAccounts,activity:viewActivity,settings:viewSettings})[S.view]()}</div></main>`;
}

function offlineBanner(){
  if(S.scenario!=="offline")return"";
  return `<div class="banner bad" role="alert">${ic("plug","lg")}<div><b>Can't reach the bot</b><p>Make sure Docker Desktop is open, then double-click <b>start.bat</b>. This page reconnects by itself.</p></div><button class="btn sm" data-act="retry">${ic("refresh")}Try again</button></div>`;
}
function problemBanner(){
  if(S.scenario!=="problem")return"";
  return `<div class="banner warn" role="alert">${ic("alert","lg")}<div><b>Bluesky didn't accept your login</b><p>Checks are on hold since 13:56. Your App Password may have been deleted. Create a new one and paste it in Settings.</p></div><button class="btn sm" data-view="settings">Update login</button></div>`;
}

/* Accounts */
function viewAccounts(){
  const sent=S.accounts.length?12:0,pr=problems();
  const head=`<div class="head"><div><h1>Accounts</h1><p>Bluesky accounts the bot watches. New posts are announced in Discord.</p></div>
    <div class="actions">${S.accounts.length?`<button class="btn" data-act="checkall">${ic("refresh")}Check all now</button>`:""}<button class="btn primary" data-act="add">${ic("plus")}Add account</button></div></div>`;
  if(!S.accounts.length){
    return head+`<div class="panel"><div class="empty"><div class="em-ic">${ic("users","lg")}</div><h3>No accounts yet</h3><p>Add any public Bluesky account: an artist, a news account, a creator. Their new posts will appear in your Discord channel.</p><button class="btn primary" data-act="add">${ic("plus")}Add your first account</button></div></div>`;
  }
  const st=status();
  const summary=`<section class="summary" aria-label="Summary">
    <div><div class="l">Status</div><div class="v ${st.dot==="ok"?"ok":st.dot==="warn"?"warn":""}"><span class="dot ${st.dot}"></span>${st.label}</div><div class="s">Checks every 5 minutes</div></div>
    <div><div class="l">Last check</div><div class="v num">${S.scenario==="problem"?"13:56":"2 min ago"}</div><div class="s">${S.scenario==="problem"?"On hold":"Next in 3 min"}</div></div>
    <div><div class="l">Posts sent today</div><div class="v num">${sent}</div><div class="s">to 2 channels</div></div>
    <div><div class="l">Problems</div><div class="v num ${pr?"bad":""}">${pr}</div><div class="s">${pr?`<a href="#" data-view="activity">See what happened</a>`:"None"}</div></div>
  </section>`;
  const rows=S.accounts.map(a=>{
    const c=chan(a.channel);
    const badge={active:`<span class="badge ok">Active</span>`,paused:`<span class="badge idle">Paused</span>`,checking:`<span class="badge busy">Checking…</span>`,
      first:`<span class="badge warn">Waiting for first check</span><span class="hint">Existing posts are skipped so Discord isn't flooded.</span>`}[a.status];
    const toggle=a.status==="paused"
      ?`<button class="btn sm" data-act="toggle" data-id="${a.id}">${ic("play")}Resume</button>`
      :`<button class="btn sm ghost" data-act="toggle" data-id="${a.id}" ${a.status==="checking"?"disabled":""}>${ic("pause")}Pause</button>`;
    return `<tr class="${a.status==="paused"?"paused":""} ${a.fresh?"fresh":""}">
      <td><div class="who"><div class="av" style="background:${a.color}">${initials(a.name)}</div><div style="min-width:0"><b>${esc(a.name)}</b><a href="https://bsky.app/profile/${esc(a.handle)}" target="_blank" rel="noopener">@${esc(a.handle)}</a></div></div></td>
      <td><span class="chan">${ic("hash")}${esc(c.name)}</span></td>
      <td>${badge}</td>
      <td class="num" style="white-space:nowrap">${a.last}<span class="hint">${a.post?"Last post sent "+a.postAt:"Nothing sent yet"}</span></td>
      <td><div class="row-acts">
        <button class="btn sm ghost" data-act="check" data-id="${a.id}" ${a.status==="paused"||a.status==="checking"?"disabled":""}>${a.status==="checking"?'<span class="spin"></span>':ic("refresh")}Check now</button>
        ${toggle}
        <button class="btn sm ghost icon-only" aria-label="More actions for ${esc(a.name)}" aria-expanded="${S.menu===a.id}" data-act="menu" data-id="${a.id}">${ic("more")}</button>
        ${S.menu===a.id?`<div class="menu" role="menu"><button role="menuitem" data-act="edit" data-id="${a.id}">${ic("pencil")}Edit</button><button role="menuitem" data-act="ext" data-id="${a.id}">${ic("ext")}Open on Bluesky</button><button role="menuitem" class="del" data-act="remove" data-id="${a.id}">${ic("trash")}Remove</button></div>`:""}
      </div></td></tr>`;}).join("");
  return head+problemBanner()+summary+`<div class="grid">
    <section class="panel"><div class="panel-h"><div><h2>Watched accounts</h2><p class="num">${S.accounts.length} accounts · ${S.accounts.filter(a=>a.status!=="paused").length} active</p></div></div>
      <div class="scroll"><table><thead><tr><th>Account</th><th>Posts to</th><th>Status</th><th>Last check</th><th><span class="sr">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <section class="panel"><div class="panel-h"><h2>Recent activity</h2><a href="#" data-view="activity" style="font-size:13px">View all</a></div>
      <ul class="feed">${S.events.slice(0,5).map(feedItem).join("")}</ul></section>
  </div>`;
}
function feedItem(e){
  const m={sent:["ok","send",`Sent to #${e.channel}`],failed:["bad","alert-c",`Couldn't send to #${e.channel}`],loginfail:["bad","lock","Bluesky login rejected"],checkfail:["idle","clock","Check didn't finish"],synced:["info","check","First check done"]}[e.type];
  return `<li><div class="ic ${m[0]}">${ic(m[1])}</div><div style="min-width:0"><div class="m"><b>${esc(e.acct)}</b> · ${m[2]}</div><div class="q">${e.type==="sent"?"“"+esc(e.text)+"”":esc(e.text)}</div>
    <div class="t num">${e.time}</div>${e.fix?`<a href="#" class="fix" data-view="settings">${e.fix} →</a>`:""}</div></li>`;
}

/* Activity */
function viewActivity(){
  const f=S.filter;
  const list=S.events.filter(e=>f==="all"||(f==="sent"?e.type==="sent":["failed","loginfail","checkfail"].includes(e.type)));
  const seg=["all","sent","problems"].map(k=>`<button aria-pressed="${f===k}" data-filter="${k}">${{all:"All",sent:"Sent",problems:"Problems"}[k]}</button>`).join("");
  const body=list.length?`<ul class="feed">${list.map(feedItem).join("")}</ul>`
    :`<div class="empty"><div class="em-ic">${ic("activity","lg")}</div><h3>${S.events.length?"Nothing here":"No activity yet"}</h3><p>${S.events.length?"No events match this filter.":"When the bot sends a post or runs into a problem, it shows up here."}</p></div>`;
  return `<div class="head"><div><h1>Activity</h1><p>Everything the bot sent to Discord and anything that went wrong, newest first.</p></div><div class="seg" role="group" aria-label="Filter">${seg}</div></div>
    ${problemBanner()}<section class="panel">${body}${list.length?`<div class="panel-f muted" style="font-size:13px">Showing the last 7 days</div>`:""}</section>`;
}

/* Settings */
function savedMsg(k){return S.saved[k]?`<span class="saved">${ic("check")}Saved. Used from the next check.</span>`:""}
function viewSettings(){
  const problem=S.scenario==="problem";
  return `<div class="head"><div><h1>Settings</h1><p>Changes apply straight away. No restart needed.</p></div></div>
  <section class="sect"><div><h2>Bluesky login</h2><p class="d">Your own Bluesky account. The bot needs it to read posts, even public ones. It's separate from the accounts you watch.</p></div>
    <form class="card" data-form="login">
      ${problem?`<div class="banner bad" style="margin-bottom:16px">${ic("alert-c")}<div><b>Login rejected</b><p>Create a new App Password and paste it below.</p></div></div>`
      :`<div class="conn"><span class="dot ok"></span>Connected as <b>@you.bsky.social</b></div>`}
      <div class="row2">
        <div class="field"><label for="s-h">Your Bluesky handle</label><input class="input" id="s-h" value="you.bsky.social" autocomplete="off"></div>
        <div class="field"><label for="s-p">App Password</label><input class="input ${problem?"err":""}" id="s-p" type="password" placeholder="${problem?"Paste a new App Password":"Saved. Type a new one to replace it"}" autocomplete="new-password"></div>
      </div>
      <details class="howto" style="margin:-4px 0 16px"><summary>How do I get an App Password?</summary><ol><li>Open bsky.app and sign in.</li><li>Go to Settings → Privacy and Security → App Passwords.</li><li>Choose Add App Password, name it “discord-bot”, and copy it.</li></ol></details>
      <div class="form-foot"><button class="btn primary" type="submit">Save login</button><button class="btn" type="button" data-act="testlogin">Test login</button>${savedMsg("login")}</div>
    </form></section>
  <section class="sect"><div><h2>Discord channels</h2><p class="d">Where announcements are posted. Each channel needs a webhook link from Discord. The default channel is used unless an account picks another.</p></div>
    <div class="card">
      <div class="chan-list">${CHANNELS.map(c=>`<div class="chan-row"><div><div class="n">${ic("hash")}${c.name}${c.isDefault?'<span class="tag">Default</span>':""}</div><div class="u">${c.url}</div></div>
        <div class="acts"><button class="btn sm" data-act="testchan" data-name="${c.name}">${ic("send")}Send test</button><button class="btn sm ghost icon-only" aria-label="Edit #${c.name}">${ic("pencil")}</button></div></div>`).join("")}</div>
      <button class="btn" data-act="addchan">${ic("plus")}Add channel</button>
      <details class="howto" style="margin-top:14px"><summary>Where do I find a webhook link?</summary><ol><li>In Discord, hover the channel and click the gear icon.</li><li>Open Integrations → Webhooks → New Webhook.</li><li>Name it “Bluesky Bot” and choose Copy Webhook URL.</li></ol></details>
    </div></section>
  <section class="sect"><div><h2>Check frequency</h2><p class="d">How often the bot looks for new posts on every active account.</p></div>
    <form class="card" data-form="freq"><div class="field" style="max-width:240px"><label for="s-f">Check every</label>
      <select class="select" id="s-f">${[1,2,5,10,15,30,60].map(n=>`<option ${n===5?"selected":""}>${n} minute${n>1?"s":""}</option>`).join("")}</select></div>
      <div class="form-foot"><button class="btn primary" type="submit">Save</button>${savedMsg("freq")}</div></form></section>`;
}

/* Setup checklist */
function viewSetup(){
  const n=S.setupStep;
  const step=(i,title,sub,body)=>{const cls=i<n?"done":i===n?"current":"";
    return `<li class="step ${cls}"><div class="step-h"><div class="step-n num">${i<n?ic("check"):i}</div><div><h3>${title}</h3><p>${i<n?"Done":sub}</p></div>${i<n?`<button class="btn sm ghost r" data-act="redo" data-step="${i}">Change</button>`:""}</div>${i===n?`<div class="step-b">${body}</div>`:""}</li>`;};
  return `<div class="head"><div><h1>Set up your bot</h1><p class="num">${n-1} of 4 done. About five minutes in total.</p></div></div>
  <ol class="steps">
    ${step(1,"Connect your Bluesky login","Your account, used to read posts",`<p class="why">The bot needs a Bluesky login to read posts, even public ones. Use an App Password, not your real password.</p>
      <div class="row2"><div class="field"><label for="w-h">Your Bluesky handle</label><input class="input" id="w-h" placeholder="yourname.bsky.social"></div><div class="field"><label for="w-p">App Password</label><input class="input" id="w-p" type="password" placeholder="xxxx-xxxx-xxxx-xxxx"></div></div>
      <details class="howto" style="margin:-4px 0 16px"><summary>How do I get an App Password?</summary><ol><li>Open bsky.app → Settings → Privacy and Security → App Passwords.</li><li>Choose Add App Password and copy it.</li></ol></details>
      <button class="btn primary" data-act="next">Test and continue</button>`)}
    ${step(2,"Choose a Discord channel","Where announcements go",`<p class="why">Discord gives each channel a webhook link that lets the bot post there. You only need one to start.</p>
      <div class="row2"><div class="field"><label for="w-n">Channel name</label><input class="input" id="w-n" placeholder="announcements"><span class="help">Just a label for you.</span></div>
      <div class="field"><label for="w-u">Webhook link</label><input class="input" id="w-u" placeholder="https://discord.com/api/webhooks/…"></div></div>
      <details class="howto" style="margin:-4px 0 16px" open><summary>Where do I find a webhook link?</summary><ol><li>In Discord, hover the channel and click the gear icon.</li><li>Open Integrations → Webhooks → New Webhook.</li><li>Name it “Bluesky Bot” and choose Copy Webhook URL.</li></ol></details>
      <button class="btn primary" data-act="next">Save and continue</button>`)}
    ${step(3,"Send a test message","Check Discord receives it",`<p class="why">This posts a sample announcement to #announcements so you can see what alerts look like.</p>
      <div class="actions"><button class="btn primary" data-act="testnext">${ic("send")}Send test message</button><button class="btn ghost" data-act="next">Skip for now</button></div>`)}
    ${step(4,"Add your first account","Pick whose posts to announce",`<p class="why">Any public Bluesky account works: artists, news, creators. It doesn't have to be yours.</p><button class="btn primary" data-act="add">${ic("plus")}Add account</button>`)}
  </ol>`;
}

/* Drawer: add / edit account */
function openDrawer(edit){
  const a=edit?S.accounts.find(x=>x.id===edit):null;
  $("#overlay").innerHTML=`<div class="scrim" data-act="close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t">
    <div class="drawer-h"><h2 id="dr-t">${a?"Edit account":"Add an account to watch"}</h2><button class="btn ghost icon-only" aria-label="Close" data-act="close">${ic("x")}</button></div>
    <form class="drawer-b" id="acct-form">
      <div class="field"><label for="d-h">Bluesky handle</label>
        <input class="input" id="d-h" ${a?`value="${esc(a.handle)}" readonly`:'placeholder="someone.bsky.social" autocomplete="off"'}>
        <span class="help">${a?"To watch a different account, add it as a new one.":"Find it on their Bluesky profile, under their name. Try “unknown” to see the not-found message."}</span>
        <div id="lookup">${a?profileCard(a):""}</div></div>
      <div class="field"><label for="d-n">Name shown in Discord</label><input class="input" id="d-n" value="${a?esc(a.name):""}" placeholder="Filled in from their profile"></div>
      <div class="field"><label for="d-c">Post to channel</label><select class="select" id="d-c">${CHANNELS.map(c=>`<option value="${c.id}" ${a&&a.channel===c.id?"selected":""}>#${c.name}${c.isDefault?" (default)":""}</option>`).join("")}<option value="new">Add a new channel…</option></select></div>
      <div id="newchan"></div>
      <fieldset class="field opts"><legend>What to announce</legend>
        <label class="opt"><input type="checkbox" ${!a||a.posts!==false?"checked":""}><span><b>Original posts</b><small>Things they write themselves</small></span></label>
        <label class="opt"><input type="checkbox" ${!a||a.reposts!==false?"checked":""}><span><b>Reposts</b><small>Other people's posts they share</small></span></label>
        <label class="opt"><input type="checkbox" ${a&&a.replies?"checked":""}><span><b>Replies</b><small>Their replies in conversations. Can be noisy.</small></span></label>
        <span class="help">Changes only affect new posts. Older ones are never sent.</span>
      </fieldset>
      ${a?"":`<div class="note">${ic("info")}<div>The first check runs straight away. It only notes their existing posts, so your channel isn't flooded. New posts after that are announced.</div></div>`}
    </form>
    <div class="drawer-f"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="d-save" form="acct-form" type="submit" ${a?"":"disabled"}>${a?"Save changes":"Add account"}</button></div>
  </aside>`;
  const h=$("#d-h");setTimeout(()=>(a?$("#d-n"):h).focus(),50);
  let t;
  if(!a)h.addEventListener("input",()=>{clearTimeout(t);const v=h.value.trim().replace(/^@/,"");$("#d-save").disabled=true;
    if(!v){$("#lookup").innerHTML="";return;}
    $("#lookup").innerHTML=`<div class="profile"><span class="spin" style="color:var(--text-3)"></span><span>Looking up @${esc(v)}…</span></div>`;
    t=setTimeout(()=>{
      if(/unknown/.test(v)){h.classList.add("err");$("#lookup").innerHTML=`<div class="err-msg" style="margin-top:4px">${ic("alert-c")}No Bluesky account called @${esc(v)}. Check the spelling, including the part after the dot.</div>`;return;}
      if(S.accounts.some(x=>x.handle===v)){h.classList.add("err");$("#lookup").innerHTML=`<div class="err-msg" style="margin-top:4px">${ic("alert-c")}You're already watching @${esc(v)}.</div>`;return;}
      h.classList.remove("err");
      const name=v.split(".")[0].replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
      $("#lookup").innerHTML=profileCard({name,handle:v.includes(".")?v:v+".bsky.social",color:"#0085FF"});
      if(!$("#d-n").value)$("#d-n").value=name;$("#d-save").disabled=false;},650);});
  $("#d-c").addEventListener("change",e=>{$("#newchan").innerHTML=e.target.value==="new"?`<div class="row2"><div class="field"><label for="d-cn">Channel name</label><input class="input" id="d-cn" placeholder="art-drops"></div><div class="field"><label for="d-cu">Webhook link</label><input class="input" id="d-cu" placeholder="https://discord.com/api/webhooks/…"></div></div>`:""});
  $("#acct-form").addEventListener("submit",e=>{e.preventDefault();a?saveEdit(a):addAccount();});
}
function profileCard(p){return `<div class="profile"><div class="av" style="background:${p.color}">${initials(p.name)}</div><div><b>${esc(p.name)}</b><span>@${esc(p.handle)}</span></div><span class="ok-ic">${ic("check","lg")}</span></div>`;}
function closeOverlay(){$("#overlay").innerHTML="";}

function addAccount(){
  const v=$("#d-h").value.trim().replace(/^@/,"");const handle=v.includes(".")?v:v+".bsky.social";
  const c=$("#d-c").value==="new"?1:+$("#d-c").value;
  const acc={id:Date.now(),name:$("#d-n").value||handle,handle,color:"#0085FF",channel:c,status:"checking",last:"—",post:null,fresh:true};
  S.accounts.unshift(acc);closeOverlay();
  if(S.scenario==="firstrun"&&S.setupStep===4){S.setupStep=5;S.view="accounts";}
  if(S.scenario==="empty"||S.scenario==="firstrun")S.scenario="normal";
  render();toast(`Watching @${handle}. Running the first check…`);
  setTimeout(()=>{acc.status="active";acc.last="just now";acc.fresh=false;S.events.unshift({type:"synced",time:"just now",clock:"14:03",acct:acc.name,channel:chan(c).name,text:"First check done. Existing posts were skipped; new posts will be announced."});render();toast(`First check done for ${acc.name}. New posts will be announced.`);},1600);
}
function saveEdit(a){a.name=$("#d-n").value||a.name;if($("#d-c").value!=="new")a.channel=+$("#d-c").value;closeOverlay();render();toast("Changes saved");}

function confirmRemove(id){
  const a=S.accounts.find(x=>x.id===id);
  $("#overlay").innerHTML=`<div class="scrim" data-act="close"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dl-t" aria-describedby="dl-d">
    <h2 id="dl-t">Stop watching ${esc(a.name)}?</h2><p id="dl-d">The bot stops checking @${esc(a.handle)}. Posts already sent to Discord stay in your channel. You can add the account again any time.</p>
    <div class="f"><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="doremove" data-id="${id}">Remove account</button></div></div>`;
  setTimeout(()=>$(".dialog .btn").focus(),30);
}

function toast(msg,bad){const el=document.createElement("div");el.className="toast"+(bad?" bad":"");el.innerHTML=ic(bad?"alert-c":"check")+`<span>${esc(msg)}</span>`;$("#toasts").appendChild(el);setTimeout(()=>el.remove(),3800);}

document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");if(v){e.preventDefault();S.view=v.dataset.view;S.menu=null;render();$("#main").scrollTop=0;window.scrollTo(0,0);return;}
  const f=e.target.closest("[data-filter]");if(f){S.filter=f.dataset.filter;render();return;}
  const b=e.target.closest("[data-act]");
  if(!b){if(S.menu){S.menu=null;render();}return;}
  const id=+b.dataset.id,a=S.accounts.find(x=>x.id===id),act=b.dataset.act;
  if(act!=="menu"&&S.menu&&!["edit","remove","ext"].includes(act)){S.menu=null;}
  switch(act){
    case "add":openDrawer();break;
    case "close":closeOverlay();break;
    case "menu":S.menu=S.menu===id?null:id;render();break;
    case "edit":S.menu=null;render();openDrawer(id);break;
    case "ext":S.menu=null;render();window.open("https://bsky.app/profile/"+a.handle,"_blank","noopener");break;
    case "remove":S.menu=null;render();confirmRemove(id);break;
    case "doremove":S.accounts=S.accounts.filter(x=>x.id!==id);closeOverlay();render();toast(`Stopped watching ${a.name}`);break;
    case "toggle":a.status=a.status==="paused"?"active":"paused";render();toast(a.status==="paused"?`${a.name} paused. No posts will be announced.`:`${a.name} resumed`);break;
    case "check":a.status="checking";render();setTimeout(()=>{a.status="active";a.last="just now";render();toast(`Checked ${a.name}. No new posts.`);},1200);break;
    case "checkall":S.accounts.forEach(x=>{if(x.status==="active")x.status="checking";});render();setTimeout(()=>{S.accounts.forEach(x=>{if(x.status==="checking"){x.status="active";x.last="just now";}});render();toast("All active accounts checked. 1 new post sent.");},1500);break;
    case "next":S.setupStep++;render();break;
    case "redo":S.setupStep=+b.dataset.step;render();break;
    case "testnext":b.disabled=true;b.innerHTML='<span class="spin"></span>Sending…';setTimeout(()=>{toast("Test message sent. Check #announcements in Discord.");S.setupStep++;render();},1000);break;
    case "testlogin":S.scenario==="problem"?toast("Bluesky still rejects this login. Paste a new App Password.",true):toast("Login works. Connected as @you.bsky.social");break;
    case "testchan":toast(`Test message sent to #${b.dataset.name}`);break;
    case "addchan":toast("Prototype: this opens the same form as the setup step");break;
    case "retry":toast("Still can't reach the bot. Is Docker Desktop running?",true);break;
  }
});
document.addEventListener("submit",e=>{const f=e.target.dataset.form;if(!f)return;e.preventDefault();S.saved[f]=true;if(f==="login"&&S.scenario==="problem")S.scenario="normal";render();toast("Saved. Used from the next check.");});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#overlay").innerHTML)closeOverlay();else if(S.menu){S.menu=null;render();}}});
$("#scenario").addEventListener("change",e=>loadScenario(e.target.value));
$("#theme").addEventListener("change",e=>{e.target.value?document.documentElement.setAttribute("data-theme",e.target.value):document.documentElement.removeAttribute("data-theme");});
/* Optional link options, e.g. #state=problem&view=settings&theme=dark&drawer=add */
const P=new URLSearchParams(location.hash.slice(1));
if(P.get("theme")){document.documentElement.setAttribute("data-theme",P.get("theme"));$("#theme").value=P.get("theme");}
loadScenario(P.get("state")||"normal");$("#scenario").value=S.scenario;
if(P.get("view")){S.view=P.get("view");if(P.get("filter"))S.filter=P.get("filter");render();}
if(P.get("drawer")==="add"){openDrawer();if(P.get("handle")){$("#d-h").value=P.get("handle");$("#d-h").dispatchEvent(new Event("input"));}}
if(P.get("menu")){S.menu=+P.get("menu");render();}
</script>
</body>
</html>
